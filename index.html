<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Forms</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            margin: 0 0 25px;
            font-size: 26px;
            color: #222;
        }

        .form-button {
            display: block;
            width: 100%;
            padding: 18px 15px;
            margin: 14px 0;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
        }

        .form-button:active {
            transform: scale(0.97);
        }

        .menaka {
            background: #4285F4;
        }

        .komala {
            background: #34A853;
        }

        .jayasri {
            background: #FB8C00;
        }

        .keerthi {
            background: #8E44AD;
        }

        .manjula {
            background: #E91E63;
        }

        .form-button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Select Staff Form</h1>

        <a class="form-button menaka"
           href="https://forms.gle/f7b8Mywi6LZFsScq5"
           target="_blank">
            Menaka (OP)
        </a>

        <a class="form-button komala"
           href="https://forms.gle/AUa7Vqhy4Z6XTGb7A"
           target="_blank">
            Komala (OP)
        </a>

        <a class="form-button jayasri"
           href="https://forms.gle/C8ipdtwRwyGKa6Nv5"
           target="_blank">
            Jayasri (Pharma)
        </a>

        <a class="form-button keerthi"
           href="https://forms.gle/75B2YumZdQ1ncchYA"
           target="_blank">
            Keerthi (OpEx)
        </a>

        <a class="form-button manjula"
           href="https://forms.gle/suaZ3gpiDeKoLrY66"
           target="_blank">
            Manjula (Lab)
        </a>

    </div>

</body>
</html>
